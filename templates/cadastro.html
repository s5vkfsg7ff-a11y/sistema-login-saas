<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar conta — Sistema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <script>
    (function () {
      var t = localStorage.getItem('theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
</head>
<body class="auth-body">

  <button class="theme-btn" onclick="toggleTheme()" aria-label="Alternar tema" title="Alternar tema">
    <span class="icon-moon">🌙</span>
    <span class="icon-sun">☀️</span>
  </button>

  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-mark">SL</div>
      <span class="brand-name">Sistema</span>
    </div>

    <h1 class="auth-title">Criar sua conta</h1>
    <p class="auth-sub">Preencha os dados abaixo para começar.</p>

    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for categoria, msg in msgs %}
        <div class="alert {{ categoria }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="field">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome"
               placeholder="Seu nome completo" required autocomplete="name" />
      </div>

      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email"
               placeholder="seu@email.com" required autocomplete="email" />
      </div>

      <div class="field">
        <label for="senha">Senha <span class="hint">(mínimo 6 caracteres)</span></label>
        <input type="password" id="senha" name="senha"
               placeholder="••••••••" minlength="6" required autocomplete="new-password" />
      </div>

      <button type="submit" class="btn btn-primary">Criar conta</button>
    </form>

    <p class="auth-footer">Já tem uma conta? <a href="{{ url_for('login') }}">Fazer login</a></p>
  </div>

  <script>
    function toggleTheme() {
      var d = document.documentElement;
      var next = d.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      d.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }
  </script>
</body>
</html>
