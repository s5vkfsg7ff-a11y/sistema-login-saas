{% extends "base.html" %}
{% block page_title %}Novo cliente{% endblock %}
{% block page_title_topbar %}Novo cliente{% endblock %}

{% block content %}

<div class="page-head">
  <div class="page-head-text">
    <h1>Novo cliente</h1>
    <p>Preencha os dados do contato.</p>
  </div>
  <a href="{{ url_for('crm') }}" class="btn btn-sm btn-ghost">← Voltar</a>
</div>

<div class="card" style="max-width:600px">
  <div class="card-head"><h2>Informações do cliente</h2></div>
  <div class="card-body">
    <form method="POST">

      <div class="form-row">
        <div class="field">
          <label for="nome">Nome *</label>
          <input type="text" id="nome" name="nome" placeholder="Nome completo" required autofocus />
        </div>
        <div class="field">
          <label for="empresa">Empresa</label>
          <input type="text" id="empresa" name="empresa" placeholder="Empresa ou organização" />
        </div>
      </div>

      <div class="form-row">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="contato@empresa.com" />
        </div>
        <div class="field">
          <label for="telefone">Telefone</label>
          <input type="tel" id="telefone" name="telefone" placeholder="(11) 90000-0000" />
        </div>
      </div>

      <div class="field">
        <label for="status">Status</label>
        <select id="status" name="status">
          <option value="lead">Lead</option>
          <option value="ativo">Ativo</option>
          <option value="inativo">Inativo</option>
        </select>
      </div>

      <div style="display:flex;gap:.75rem;margin-top:.25rem">
        <button type="submit" class="btn btn-primary" style="flex:1">Salvar cliente</button>
        <a href="{{ url_for('crm') }}" class="btn btn-ghost" style="flex:0 0 auto">Cancelar</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
